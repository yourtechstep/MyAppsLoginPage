<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container" data-qa="login-container">
        <h2 data-qa="login-title">Login to My Apps</h2>
        <form id="loginForm" data-qa="login-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required data-qa="username-input">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required data-qa="password-input">
            </div>
            <!-- <button type="submit">Login</button> -->
            <button class="login-btn" data-qa="login-button">Login</button>
        </form>
        <p id="message" data-qa="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
